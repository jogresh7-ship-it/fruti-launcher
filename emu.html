<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Fruti Player</title>
  <style>
    :root { --accent: #22c55e; }
    html, body { margin: 0; height: 100%; background: #07090d; overflow: hidden; color: #eef1f6; font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    #game { width: 100%; height: 100%; }
    .screen { height: 100%; display: grid; place-items: center; padding: 16px; box-sizing: border-box; text-align: center; position: relative; overflow: hidden; }
    .screen-bg { position: absolute; inset: -40px; background: center / cover no-repeat; filter: blur(30px) brightness(.35); transform: scale(1.1); }
    .box { position: relative; width: min(440px, 100%); }
    .box img { width: 160px; height: 160px; border-radius: 16px; object-fit: cover; box-shadow: 0 20px 50px rgba(0,0,0,.6); margin-bottom: 22px; }
    .box h1 { font-size: 22px; margin: 0 0 6px; }
    .box p { color: #a3abba; font-size: 14px; margin: 0 0 22px; }
    .bar { height: 6px; border-radius: 6px; background: rgba(255,255,255,.12); overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .2s; }
    .bar.indef i { width: 35%; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
    .status { margin-top: 10px; font-size: 13px; color: #8b93a3; font-variant-numeric: tabular-nums; min-height: 20px; }
    .btn { display: inline-block; background: var(--accent); color: #05070a; font-weight: 700; padding: 13px 22px; border-radius: 12px; cursor: pointer; border: 0; font: inherit; font-weight: 700; }
    .btn input { display: none; }
    .err { color: #ff8c8c; }
    code { background: rgba(255,255,255,.08); padding: 2px 6px; border-radius: 5px; font-size: 12px; word-break: break-all; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script src="consoles.js"></script>
  <script src="games.js"></script>
  <script>
    // Console player (EmulatorJS).
    //   emu.html?system=<console>&id=<game id>     -> downloads the game's `cdn` ROM from FRUTI_ROM_SOURCES
    //   emu.html?system=<console>&game=<rom id>    -> plays games/<console>/<rom id>.js (ROM embedded as base64)
    //   emu.html?system=<console>                  -> lets you pick a ROM file from your computer
    (function () {
      var stage = document.getElementById("game");
      var q = new URLSearchParams(location.search);
      var sys = (window.FRUTI_CONSOLES || []).filter(function (c) { return c.id === (q.get("system") || "n64"); })[0];
      var games = window.FRUTI_GAMES || [];
      try {
        var s = JSON.parse(localStorage.getItem("fruti:settings") || "{}");
        if (s.accent) document.documentElement.style.setProperty("--accent", s.accent);
      } catch (e) {}
      var accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#22c55e";
      var esc = function (t) { return String(t).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };

      function screen(g, inner) {
        stage.innerHTML = '<div class="screen">' + (g && g.image ? '<div class="screen-bg" style="background-image:url(\'' + esc(g.image) + '\')"></div>' : "") +
          '<div class="box">' + (g && g.image ? '<img src="art/' + esc(g.id) + '.webp" onerror="this.onerror=null;this.src=\'' + esc(g.image) + '\'" alt="">' : "") + inner + "</div></div>";
      }
      function message(t, g) { screen(g, "<p>" + t + "</p>"); }

      if (!sys) return message("Unknown console.");
      if (sys.emu === false) return message(esc(sys.name) + " can't be emulated in the browser yet.");

      function loadScript(src) {
        return new Promise(function (ok, fail) {
          var s = document.createElement("script");
          s.src = src; s.onload = ok; s.onerror = function () { fail(new Error("Could not load " + src)); };
          document.head.appendChild(s);
        });
      }
      function b64ToBytes(b64) {
        if (Uint8Array.fromBase64) return Uint8Array.fromBase64(b64);
        var bin = atob(b64), out = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out;
      }
      function setIcon(g) {
        if (!g || !g.image) return;
        var l = document.createElement("link"); l.rel = "icon"; l.href = g.image; document.head.appendChild(l);
      }

      // rom: a File. Its name is kept so EmulatorJS saves states per game.
      function start(rom, name, gid) {
        document.title = name + " - Fruti";
        stage.innerHTML = "";
        window.EJS_player = "#game";
        window.EJS_core = sys.id;
        window.EJS_gameName = name;
        window.EJS_gameUrl = rom;
        window.EJS_pathtodata = "emulatorjs/data/";
        window.EJS_paths = { "compression.js": "emulatorjs/fruti-compression.js" };
        window.EJS_DEBUG_XX = true;             // load the non-minified scripts we ship
        window.EJS_startOnLoaded = true;
        window.EJS_threads = false;             // GitHub Pages can't enable SharedArrayBuffer
        window.EJS_color = accent;
        loadScript("emulatorjs/data/loader.js");
        trackTime(gid);
      }

      // Save play time (read by the launcher tab)
      function trackTime(gid) {
        var last = Date.now();
        function save() {
          var now = Date.now(), add = now - last; last = now;
          try {
            var t = JSON.parse(localStorage.getItem("fruti:times") || "{}");
            t[gid] = (t[gid] || 0) + add;
            localStorage.setItem("fruti:times", JSON.stringify(t));
          } catch (e) {}
        }
        setInterval(function () { if (!document.hidden) save(); }, 15000);
        addEventListener("pagehide", save);
        document.addEventListener("visibilitychange", function () { if (document.hidden) save(); else last = Date.now(); });
      }

      // Download a ROM, trying each source in order, with progress.
      function download(path, onProgress) {
        var enc = path.split("/").map(encodeURIComponent).join("/");
        var sources = (window.FRUTI_ROM_SOURCES || []).slice();
        var tried = [];
        function next() {
          if (!sources.length) return Promise.reject(new Error(tried.join("; ")));
          var base = sources.shift(), host = base.replace(/^https?:\/\/([^/]+).*$/, "$1");
          onProgress(0, 0, host);
          return fetch(base + enc).then(function (res) {
            if (!res.ok) throw new Error(host + " answered " + res.status);
            var total = +res.headers.get("content-length") || 0;
            if (!res.body || !res.body.getReader) return res.blob();
            var reader = res.body.getReader(), chunks = [], got = 0;
            function pump() {
              return reader.read().then(function (r) {
                if (r.done) return new Blob(chunks);
                chunks.push(r.value); got += r.value.length;
                onProgress(got, total, host);
                return pump();
              });
            }
            return pump();
          }).catch(function (e) {
            tried.push(e.message && e.message.indexOf(host) === 0 ? e.message : host + ": " + (e.message || "failed"));
            return next();
          });
        }
        return next();
      }
      var mb = function (n) { return (n / 1048576).toFixed(n < 10485760 ? 1 : 0) + " MB"; };

      var gid = q.get("id"), romId = q.get("game");

      if (gid) {
        // ROM from the CDN
        var g = games.filter(function (x) { return x.id === gid && x.cdn; })[0];
        if (!g) return message("This game isn't in games.js.");
        setIcon(g);
        document.title = g.title + " - Fruti";
        screen(g, "<h1>" + esc(g.title) + "</h1><p>" + esc(sys.name) + '</p><div class="bar indef" id="bar"><i></i></div><div class="status" id="status">Connecting…</div>');
        var bar = document.getElementById("bar"), status = document.getElementById("status");
        download(g.cdn, function (got, total, host) {
          if (total) { bar.className = "bar"; bar.firstChild.style.width = (got / total * 100).toFixed(1) + "%"; }
          status.textContent = got ? "Downloading " + mb(got) + (total ? " of " + mb(total) : "") + " · " + host : "Connecting to " + host + "…";
        }).then(function (blob) {
          status.textContent = "Starting emulator…";
          var file = new File([blob], g.cdn.split("/").pop());
          start(file, g.title, g.id);
        }).catch(function (e) {
          screen(g, "<h1>" + esc(g.title) + '</h1><p class="err">Couldn\'t download this ROM.</p><p>Make sure <code>' + esc(g.cdn) +
            "</code> exists in the rom-games repo and you're online.</p><p><small>" + esc(e.message) + "</small></p>");
        });
      } else if (romId) {
        // ROM embedded in games/<console>/<id>.js
        if (!/^[\w-]+$/.test(romId)) return message("No game selected.");
        var eg = games.filter(function (x) { return x.rom === romId && (x.console || "n64") === sys.id; })[0];
        setIcon(eg);
        screen(eg, "<h1>" + esc(eg ? eg.title : romId) + '</h1><div class="bar indef"><i></i></div><div class="status">Loading…</div>');
        loadScript("games/" + sys.id + "/" + romId + ".js").then(function () {
          var bytes = b64ToBytes(window.FRUTI_ROM[romId]);
          delete window.FRUTI_ROM[romId];
          start(new File([bytes], romId + (sys.ext[0] || ".bin")), eg ? eg.title : romId, eg ? eg.id : romId);
        }).catch(function () { message("This game failed to load.", eg); });
      } else {
        // Pick a ROM from this computer
        document.title = sys.name + " - Fruti";
        var exts = sys.ext.concat([".zip", ".7z"]);
        screen(null, "<h1>Play a " + esc(sys.name) + " game</h1><p>Choose a ROM from your computer (" + esc(exts.join(", ")) +
          "). Any size works. It stays on your computer and is not uploaded anywhere.</p>" +
          '<label class="btn">Choose ROM file<input type="file" id="rom" accept="' + esc(exts.join(",")) + '"></label>');
        document.getElementById("rom").onchange = function (e) {
          var f = e.target.files[0];
          if (f) { var n = f.name.replace(/\.[^.]+$/, ""); start(f, n, n); }
        };
      }
    })();
  </script>
</body>
</html>
