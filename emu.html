<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fruti Player</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #f3f5f8; font-family: Inter, system-ui, sans-serif; }
    #game { width: 100%; height: 100%; }
    .pick { height: 100%; display: grid; place-items: center; text-align: center; padding: 16px; box-sizing: border-box; }
    .pick-box { max-width: 460px; background: rgba(13,17,24,.9); border: 1px solid rgba(255,255,255,.08); border-radius: 18px; padding: 32px; }
    .pick h1 { font-size: 22px; margin: 0 0 8px; }
    .pick p { color: #8d95a5; font-size: 14px; line-height: 1.6; margin: 0 0 22px; }
    .pick label { display: inline-block; background: #fff; color: #000; font-weight: 700; padding: 13px 22px; border-radius: 10px; cursor: pointer; }
    .pick input { display: none; }
    .msg { height: 100%; display: grid; place-items: center; color: #8d95a5; padding: 16px; text-align: center; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script src="consoles.js"></script>
  <script src="games.js"></script>
  <script>
    // Console player (EmulatorJS).
    //   emu.html?system=<console>&game=<rom id>  -> plays games/<console>/<rom id>.js (ROM embedded as base64)
    //   emu.html?system=<console>                -> lets you pick a ROM file from your computer
    (function () {
      var stage = document.getElementById("game");
      var q = new URLSearchParams(location.search);
      var id = q.get("game");
      var sys = (window.FRUTI_CONSOLES || []).filter(function (c) { return c.id === (q.get("system") || "n64"); })[0];
      if (!sys) { stage.innerHTML = '<div class="msg">Unknown console.</div>'; return; }

      function loadScript(src) {
        return new Promise(function (ok, fail) {
          var s = document.createElement("script");
          s.src = src; s.onload = ok; s.onerror = function () { fail(new Error("Could not load " + src)); };
          document.head.appendChild(s);
        });
      }
      function b64ToBytes(b64) {
        if (Uint8Array.fromBase64) return Uint8Array.fromBase64(b64);
        var bin = atob(b64), out = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out;
      }

      function start(rom, name) {
        document.title = name + " - Fruti";
        stage.innerHTML = "";
        window.EJS_player = "#game";
        window.EJS_core = sys.id;
        window.EJS_gameName = name;
        window.EJS_gameUrl = rom;               // File, Blob or Uint8Array
        window.EJS_pathtodata = "emulatorjs/data/";
        window.EJS_paths = { "compression.js": "emulatorjs/fruti-compression.js" };
        window.EJS_DEBUG_XX = true;             // load the non-minified scripts we ship
        window.EJS_startOnLoaded = true;
        window.EJS_threads = false;             // GitHub Pages can't enable SharedArrayBuffer
        window.EJS_color = "#22c55e";
        loadScript("emulatorjs/data/loader.js");
        trackTime(id || name);
      }

      // Save play time (read by the launcher tab)
      function trackTime(gid) {
        var last = Date.now();
        function save() {
          var now = Date.now(), add = now - last; last = now;
          try {
            var t = JSON.parse(localStorage.getItem("fruti:times") || "{}");
            t[gid] = (t[gid] || 0) + add;
            localStorage.setItem("fruti:times", JSON.stringify(t));
          } catch (e) {}
        }
        setInterval(function () { if (!document.hidden) save(); }, 15000);
        addEventListener("pagehide", save);
        document.addEventListener("visibilitychange", function () { if (document.hidden) save(); else last = Date.now(); });
      }

      if (id) {
        if (!/^[\w-]+$/.test(id)) { stage.innerHTML = '<div class="msg">No game selected.</div>'; return; }
        var g = (window.FRUTI_GAMES || []).filter(function (x) { return x.rom === id && (x.console || "n64") === sys.id; })[0];
        if (g && g.image) { var l = document.createElement("link"); l.rel = "icon"; l.href = g.image; document.head.appendChild(l); }
        stage.innerHTML = '<div class="msg">Loading…</div>';
        loadScript("games/" + sys.id + "/" + id + ".js").then(function () {
          var bytes = b64ToBytes(window.FRUTI_ROM[id]);
          delete window.FRUTI_ROM[id];
          start(bytes, g ? g.title : id);
        }).catch(function () {
          stage.innerHTML = '<div class="msg">This game failed to load.</div>';
        });
      } else {
        document.title = sys.name + " - Fruti";
        stage.innerHTML =
          '<div class="pick"><div class="pick-box">' +
          '<h1>Play a ' + sys.name + ' game</h1>' +
          '<p>Choose a ' + sys.name + ' ROM from your computer (' + sys.ext.concat([".zip", ".7z"]).join(", ") + '). Any size works. It stays on your computer and is not uploaded anywhere.</p>' +
          '<label>Choose ROM file<input type="file" id="rom" accept="' + sys.ext.concat([".zip", ".7z"]).join(",") + '"></label>' +
          '</div></div>';
        document.getElementById("rom").onchange = function (e) {
          var f = e.target.files[0];
          if (f) start(f, f.name.replace(/\.[^.]+$/, ""));
        };
      }
    })();
  </script>
</body>
</html>
