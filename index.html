<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fruti Launcher</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2329b6f6'/%3E%3Cpath d='M11 9h11v3.5h-7v3h6v3.5h-6V24h-4z' fill='%230f1218'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="fonts.css?v=1">
  <link rel="stylesheet" href="desktop.css?v=1">
</head>
<body>
  <div class="app" id="app">
    <!-- Left icon rail -->
    <nav class="rail" id="rail" aria-label="Main">
      <button class="rail-logo" data-page="library" title="Fruti Launcher">F</button>
    </nav>

    <!-- Top toolbar -->
    <header class="topbar">
      <div class="tb-group">
        <label class="search" title="Search ( / )">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="search" type="search" placeholder="Search library" autocomplete="off">
        </label>
        <button class="tb-btn" id="tb-fav" title="Show favorites only"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>
        <button class="tb-btn" id="tb-group" title="Group by"><svg viewBox="0 0 24 24"><path d="M4 5h16M8 10h12M8 15h12M4 5v15h4"/></svg></button>
        <button class="tb-btn" id="tb-sort" title="Sort by"><svg viewBox="0 0 24 24"><path d="M7 4v16m0 0-3-3m3 3 3-3M17 20V4m0 0-3 3m3-3 3 3"/></svg></button>
        <button class="tb-btn" id="tb-plat" title="Filter by platform"><svg viewBox="0 0 24 24"><path d="M6 11h4M8 9v4M15 12h.01M18 10h.01"/><path d="M17.3 5H6.7a4 4 0 0 0-4 3.6L2 15.5A3 3 0 0 0 7.2 18l1.3-2h7l1.3 2a3 3 0 0 0 5.2-2.5l-.7-6.9A4 4 0 0 0 17.3 5z"/></svg></button>
        <span class="tb-sep"></span>
        <button class="tb-btn mode" data-mode="details" title="Details view"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="6" height="16" rx="1"/><rect x="11" y="4" width="10" height="16" rx="1"/></svg></button>
        <button class="tb-btn mode" data-mode="grid" title="Grid view"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg></button>
        <button class="tb-btn mode" data-mode="list" title="List view"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
        <span class="tb-sep"></span>
        <button class="tb-btn" id="tb-random" title="Pick a random game"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 8h.01M16 8h.01M12 12h.01M8 16h.01M16 16h.01"/></svg></button>
        <button class="filter-chip" id="filter-chip" hidden title="Clear filters">
          <svg viewBox="0 0 24 24"><path d="M3 4h18l-7 8.5V19l-4 2v-8.5z"/></svg>Filter Active
        </button>
      </div>
      <div class="tb-right">
        <span class="tb-count" id="count"></span>
        <span class="tb-clock" id="clock">--:--</span>
      </div>
    </header>

    <!-- Library -->
    <main class="content page active" data-page="library" id="content">
      <section class="list-panel" id="list" tabindex="0" aria-label="Games"></section>
      <section class="grid-panel" id="grid" tabindex="0" aria-label="Games"></section>
      <section class="table-panel" id="table" tabindex="0" aria-label="Games"></section>
      <section class="details" id="details" aria-live="polite"></section>
    </main>

    <!-- Emulators -->
    <main class="page scroll-page" data-page="emulators">
      <div class="pg-inner">
        <h1 class="pg-title">Emulators</h1>
        <p class="pg-sub">Play a ROM straight from your computer. Nothing is uploaded.</p>
        <div class="emu-grid" id="emu-grid"></div>
      </div>
    </main>

    <!-- Statistics -->
    <main class="page scroll-page" data-page="stats">
      <div class="pg-inner" id="stats"></div>
    </main>

    <!-- Settings -->
    <main class="page scroll-page" data-page="settings">
      <div class="pg-inner">
        <h1 class="pg-title">Settings</h1>
        <div class="set-card">
          <h3>Accent color</h3>
          <div class="swatches" id="swatches"></div>
        </div>
        <div class="set-card">
          <h3>Grid cover size</h3>
          <input type="range" id="set-size" min="130" max="260" step="10">
        </div>
        <div class="set-card">
          <label class="toggle"><input type="checkbox" id="set-bg"><span>Show game art behind details</span></label>
          <label class="toggle"><input type="checkbox" id="set-titles"><span>Show titles on grid covers</span></label>
        </div>
        <div class="set-card">
          <h3>Other</h3>
          <div class="set-row">
            <a class="btn-ghost" href="classic.html">Switch to the classic Fruti UI</a>
            <button class="btn-ghost danger" id="set-clear">Clear play history</button>
          </div>
        </div>
        <p class="pg-sub">Keys: <kbd>/</kbd> search · <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> select · <kbd>Enter</kbd> play · <kbd>F</kbd> favorite</p>
      </div>
    </main>
  </div>

  <div class="menu" id="menu" hidden></div>

  <script src="consoles.js?v=1"></script>
  <script src="games.js?v=8"></script>
  <script src="desktop.js?v=1"></script>
</body>
</html>
