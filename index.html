<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fruti Launcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <div class="app" id="app">
    <main class="main">
      <div class="badge"><span class="badge-logo">F</span>FRUTI LAUNCHER</div>

      <!-- Home -->
      <section class="view" data-view="home">
        <h2 class="section-title">Continue Playing</h2>
        <div class="hero" id="hero">
          <div class="hero-bg" id="heroBg"></div>
          <div class="hero-shade"></div>
          <div class="hero-content">
            <span class="pill">FEATURED</span>
            <h1 id="heroTitle"></h1>
            <div class="hero-tags" id="heroTags"></div>
          </div>
          <div class="hero-dots" id="heroDots"></div>
        </div>

        <h2 class="section-title">Games We Recommend</h2>
        <div class="row" id="recommend"></div>
      </section>

      <!-- Library -->
      <section class="view" data-view="library" hidden>
        <div class="library-head">
          <h2 class="section-title">Library</h2>
          <input id="search" class="search" type="search" placeholder="Search games…" autocomplete="off">
        </div>
        <div class="grid" id="library"></div>
      </section>

      <!-- Gifts -->
      <section class="view" data-view="gifts" hidden>
        <h2 class="section-title">Gifts</h2>
        <p class="muted">Nothing here yet. Check back later.</p>
      </section>

      <!-- Settings -->
      <section class="view" data-view="settings" hidden>
        <h2 class="section-title">Settings</h2>
        <div class="settings">
          <label class="setting"><span>Open games in fullscreen</span><input type="checkbox" id="optFullscreen"></label>
          <label class="setting"><span>Auto-rotate featured banner</span><input type="checkbox" id="optRotate" checked></label>
          <button class="btn" id="clearHistory">Clear played history</button>
        </div>
      </section>

      <!-- Account -->
      <section class="view" data-view="account" hidden>
        <h2 class="section-title">Account</h2>
        <div class="settings">
          <label class="setting"><span>Display name</span><input type="text" id="optName" class="text" placeholder="Player"></label>
        </div>
      </section>
    </main>

    <aside class="sidebar">
      <button class="icon-btn toggle" id="toggle" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <nav class="nav" id="nav">
        <button class="nav-item active" data-view="home"><span class="nav-icon logo">F</span><span class="label">Fruti</span></button>
        <button class="nav-item" data-view="library"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11"/></svg><span class="label">Library</span></button>
        <button class="nav-item" data-view="gifts"><svg viewBox="0 0 24 24"><path d="M4 11h16v9H4zM3 7h18v4H3zM12 7v13M12 7c-2-4-6-3-5 0M12 7c2-4 6-3 5 0"/></svg><span class="label">Gifts</span></button>
        <button class="nav-item" data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span class="label">Settings</span></button>
        <button class="nav-item" data-view="account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span class="label">Account</span></button>
      </nav>
      <div class="history">
        <div class="history-title label">PLAYED HISTORY</div>
        <div class="history-list" id="history"></div>
      </div>
      <div class="foot">
        <div class="clock"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="clock"></span></div>
        <div class="label total-label">TOTAL PLAYED TIME:</div>
        <div class="label total" id="total">0m</div>
      </div>
    </aside>
  </div>

  <!-- Player -->
  <div class="player" id="player" hidden>
    <div class="player-bar">
      <span id="playerTitle"></span>
      <div>
        <button class="btn" id="playerFull">Fullscreen</button>
        <button class="btn" id="playerClose">Close</button>
      </div>
    </div>
    <iframe id="playerFrame" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
    <div class="player-empty" id="playerEmpty">No URL set for this game yet. Add one in <code>games.js</code>.</div>
  </div>

  <script src="games.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
