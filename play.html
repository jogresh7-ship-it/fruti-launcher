<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fruti Player</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #stage { width: 100%; height: 100%; }
    #stage ruffle-player { width: 100%; height: 100%; display: block; }
    .msg { color: #8a8f98; font: 16px Inter, system-ui, sans-serif; display: grid; place-items: center; height: 100%; text-align: center; padding: 16px; }
  </style>
</head>
<body>
  <div id="stage"><div class="msg">Loading…</div></div>
  <script>
    // Works without a server: the Ruffle engine (.wasm) and each game (.swf) are stored
    // as base64 inside .js files, which browsers can load from file:// with a <script> tag.
    function loadScript(src) {
      return new Promise(function (ok, fail) {
        var s = document.createElement("script");
        s.src = src; s.onload = ok; s.onerror = function () { fail(new Error("Could not load " + src)); };
        document.head.appendChild(s);
      });
    }
    function b64ToBytes(b64) {
      if (Uint8Array.fromBase64) return Uint8Array.fromBase64(b64);
      var bin = atob(b64), out = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }
    // Serve Ruffle's .wasm requests from the embedded copies instead of the network.
    var realFetch = window.fetch.bind(window);
    window.fetch = function (input, init) {
      var url = typeof input === "string" ? input : (input && input.url) || String(input);
      var m = /([0-9a-f]+\.wasm)(?:[?#].*)?$/.exec(url);
      if (!m) return realFetch(input, init);
      var name = m[1];
      return loadScript("ruffle/" + name + ".js").then(function () {
        var bytes = b64ToBytes(window.FRUTI_WASM[name]);
        delete window.FRUTI_WASM[name];
        return new Response(bytes, { headers: { "Content-Type": "application/wasm" } });
      });
    };
  </script>
  <script src="games.js"></script>
  <!-- Ruffle 0.7.1, Flash Player emulator (https://ruffle.rs), bundled in ruffle/ -->
  <script src="ruffle/ruffle.js"></script>
  <script>
    (function () {
      var stage = document.getElementById("stage");
      var msg = function (t) { stage.innerHTML = '<div class="msg">' + t + "</div>"; };
      var id = new URLSearchParams(location.search).get("game");
      if (!id || !/^[\w-]+$/.test(id)) return msg("No game selected.");
      if (!window.RufflePlayer) return msg("Could not load the Flash emulator.");

      // Tab title + icon from the game list
      var g = (window.FRUTI_GAMES || []).filter(function (x) { return x.swf === id; })[0];
      if (g) {
        document.title = g.title + " - Fruti";
        if (g.image) { var l = document.createElement("link"); l.rel = "icon"; l.href = g.image; document.head.appendChild(l); }
      }

      // Save play time (read by the launcher tab)
      var gid = g ? g.id : id, last = Date.now();
      function saveTime() {
        var now = Date.now(), add = now - last; last = now;
        try {
          var t = JSON.parse(localStorage.getItem("fruti:times") || "{}");
          t[gid] = (t[gid] || 0) + add;
          localStorage.setItem("fruti:times", JSON.stringify(t));
        } catch (e) {}
      }
      setInterval(function () { if (!document.hidden) saveTime(); }, 15000);
      addEventListener("pagehide", saveTime);
      document.addEventListener("visibilitychange", function () { if (document.hidden) saveTime(); else last = Date.now(); });

      window.RufflePlayer.config = {
        autoplay: "on",
        unmuteOverlay: "hidden",
        letterbox: "on",
        scale: "showAll",
        forceScale: true,
        backgroundColor: "#000000",
        splashScreen: false,
        contextMenu: "rightClickOnly",
        allowScriptAccess: false,
        warnOnUnsupportedContent: false,
      };

      loadScript("games/" + id + ".js").then(function () {
        var data = b64ToBytes(window.FRUTI_SWF[id]);
        delete window.FRUTI_SWF[id];
        var player = window.RufflePlayer.newest().createPlayer();
        stage.innerHTML = "";
        stage.appendChild(player);
        return player.ruffle().load({ data: data.buffer, swfFileName: id + ".swf" });
      }).catch(function (e) {
        console.error(e);
        msg("This game failed to load.");
      });
    })();
  </script>
</body>
</html>
