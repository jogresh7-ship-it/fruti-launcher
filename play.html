<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fruti Player</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #stage { width: 100%; height: 100%; }
    #stage ruffle-player, #stage ruffle-embed { width: 100%; height: 100%; display: block; }
    .msg { color: #8a8f98; font: 16px Inter, system-ui, sans-serif; display: grid; place-items: center; height: 100%; text-align: center; padding: 16px; }
  </style>
</head>
<body>
  <div id="stage"><div class="msg">Loading…</div></div>
  <!-- Ruffle 0.7.1, Flash Player emulator (https://ruffle.rs), bundled in ruffle/ -->
  <script src="ruffle/ruffle.js"></script>
  <script>
    (function () {
      const stage = document.getElementById("stage");
      const swf = new URLSearchParams(location.search).get("swf");
      // Only allow SWFs from this site's games/ folder.
      if (!swf || !/^games\/[\w.-]+\.swf$/.test(swf)) {
        stage.innerHTML = '<div class="msg">No game selected.</div>';
        return;
      }
      if (!window.RufflePlayer) {
        stage.innerHTML = '<div class="msg">Could not load the Flash emulator.</div>';
        return;
      }
      window.RufflePlayer.config = {
        autoplay: "on",
        unmuteOverlay: "hidden",
        letterbox: "on",
        backgroundColor: "#000000",
        splashScreen: false,
        contextMenu: "rightClickOnly",
        allowScriptAccess: false,
        warnOnUnsupportedContent: false,
      };
      const player = window.RufflePlayer.newest().createPlayer();
      stage.innerHTML = "";
      stage.appendChild(player);
      player.ruffle().load({ url: swf }).catch(function () {
        stage.innerHTML = '<div class="msg">This game failed to load.</div>';
      });
    })();
  </script>
</body>
</html>
